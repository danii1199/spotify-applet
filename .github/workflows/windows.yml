# Compila Spotify Mini (versión Windows) en un .exe único que no necesita instalar .NET.
# En cada push que toque windows/ deja el .exe como artefacto; con una etiqueta win-v* crea una release.
name: Windows

on:
  push:
    paths: ['windows/**', '.github/workflows/windows.yml']
    tags: ['win-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compilar
        run: >
          dotnet publish windows/SpotifyMini/SpotifyMini.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o out
      - uses: actions/upload-artifact@v4
        with:
          name: SpotifyMini
          path: out/SpotifyMini.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/win-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" out/SpotifyMini.exe --title "Spotify Mini ${{ github.ref_name }}" --notes "Versión para Windows. Descarga SpotifyMini.exe y ábrelo."
